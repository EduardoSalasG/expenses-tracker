services:
  expenses-tracker-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/eduardosalasg/expenses-tracker-backend:latest}
    container_name: expenses-tracker-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

  expenses-tracker-inbound-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/eduardosalasg/expenses-tracker-backend:latest}
    container_name: expenses-tracker-inbound-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/infrastructure/process-inbound-events-daemon.js"]

  expenses-tracker-monthly-account-reports:
    image: ${BACKEND_IMAGE:-ghcr.io/eduardosalasg/expenses-tracker-backend:latest}
    env_file:
      - .env
    command: ["node", "dist/infrastructure/send-monthly-account-email-reports.js"]

  expenses-tracker-push-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/eduardosalasg/expenses-tracker-backend:latest}
    container_name: expenses-tracker-push-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/infrastructure/process-push-deliveries-daemon.js"]
