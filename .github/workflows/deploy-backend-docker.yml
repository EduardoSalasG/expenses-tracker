name: Deploy expenses-tracker backend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/expenses-tracker-backend
  CONTAINER_DIR: /opt/apps/expenses-tracker/backend
  PUBLIC_API_HOST: api.expenses-tracker.eduardosalasg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @expenses-tracker/backend test

      - name: Run backend build
        run: pnpm --filter @expenses-tracker/backend build

      - name: Normalize image name
        run: |
          IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --provenance=false \
            --push \
            -f backend/Dockerfile \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production compose file to server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "mkdir -p ${{ env.CONTAINER_DIR }}"
          scp -i ~/.ssh/oracle_deploy_key \
            backend/compose.production.yaml \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:${{ env.CONTAINER_DIR }}/compose.yaml

      - name: Deploy on Oracle VM
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'
              set -e

              cd "${{ env.CONTAINER_DIR }}"

              exec 9>/tmp/expenses-tracker-backend-deploy.lock
              flock -w 900 9 || {
                echo "Could not acquire backend deploy lock."
                exit 1
              }

              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
                -u "${{ secrets.GHCR_USERNAME }}" \
                --password-stdin

              REMOTE_IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
              export BACKEND_IMAGE="$REMOTE_IMAGE_NAME:${{ github.sha }}"
              if [ -z "$BACKEND_IMAGE" ]; then
                echo "BACKEND_IMAGE is not set."
                exit 1
              fi

              echo "Pulling exact backend image: $BACKEND_IMAGE"
              docker pull "$BACKEND_IMAGE"
              # bootstrap runs tracked migrations first, then idempotently applies
              # the system defaults required by a brand-new database.
              docker compose run --rm --no-deps expenses-tracker-backend node dist/infrastructure/db-runner.js bootstrap
              # Idempotent: assigns a personal financial account to legacy user-owned rows.
              docker compose run --rm --no-deps expenses-tracker-backend node dist/infrastructure/db-backfill-financial-accounts.js
              docker compose up -d --force-recreate --remove-orphans expenses-tracker-backend

              expected_image_id=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
              running_image_id=$(docker inspect expenses-tracker-backend --format '{{.Image}}')
              if [ "$running_image_id" != "$expected_image_id" ]; then
                echo "Running container image does not match $BACKEND_IMAGE."
                echo "Expected: $expected_image_id"
                echo "Running:  $running_image_id"
                docker compose ps
                exit 1
              fi

              for attempt in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "Backend failed health check after deploy."
                  docker compose ps
                  docker logs --tail=200 expenses-tracker-backend || true
                  exit 1
                fi

                sleep 2
              done

              # A health response alone can come from an older container image.
              # This protected route must exist and reject the anonymous probe.
              route_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/me/account-context)
              if [ "$route_status" != "401" ]; then
                echo "Expected /me/account-context to return 401 after deploy; received $route_status."
                docker compose ps
                docker logs --tail=200 expenses-tracker-backend || true
                exit 1
              fi

              docker image prune -f
          EOF

      - name: Reload Nginx and verify its API upstream
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            << 'EOF'
              set -e

              sudo systemctl reload nginx

              # Validate the real HTTPS Nginx virtual host. Port 80 correctly
              # redirects to HTTPS, so an HTTP probe would report 301 instead of
              # the expected anonymous 401 from the backend route.
              proxy_status=$(curl -ks -o /dev/null -w "%{http_code}" \
                --resolve "${{ env.PUBLIC_API_HOST }}:443:127.0.0.1" \
                "https://${{ env.PUBLIC_API_HOST }}/me/account-context")
              if [ "$proxy_status" != "401" ]; then
                echo "Expected Nginx to proxy /me/account-context with a 401; received $proxy_status."
                sudo nginx -T
                exit 1
              fi
          EOF
