name: Deploy expenses-tracker backend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/expenses-tracker-backend
  CONTAINER_DIR: /opt/apps/expenses-tracker/backend
  PUBLIC_API_HOST: api.expenses-tracker.eduardosalasg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @expenses-tracker/backend test

      - name: Run backend build
        run: pnpm --filter @expenses-tracker/backend build

      - name: Normalize image name
        run: |
          IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --provenance=false \
            --push \
            -f backend/Dockerfile \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production compose file to server
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "mkdir -p ${{ env.CONTAINER_DIR }}"
          scp -i ~/.ssh/oracle_deploy_key \
            backend/compose.production.yaml \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:${{ env.CONTAINER_DIR }}/compose.yaml

      - name: Deploy on Oracle VM
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'
              set -e

              cd "${{ env.CONTAINER_DIR }}"

              exec 9>/tmp/expenses-tracker-backend-deploy.lock
              flock -w 900 9 || {
                echo "Could not acquire backend deploy lock."
                exit 1
              }

              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
                -u "${{ secrets.GHCR_USERNAME }}" \
                --password-stdin

              REMOTE_IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
              export BACKEND_IMAGE="$REMOTE_IMAGE_NAME:${{ github.sha }}"
              if [ -z "$BACKEND_IMAGE" ]; then
                echo "BACKEND_IMAGE is not set."
                exit 1
              fi

              echo "Deploying image: $BACKEND_IMAGE"
              docker pull "$BACKEND_IMAGE"
              resolved_images=$(docker compose config --images | sort -u)
              echo "Compose resolved images: $resolved_images"
              if [ "$resolved_images" != "$BACKEND_IMAGE" ]; then
                echo "Compose resolved the wrong images. Expected only: $BACKEND_IMAGE; resolved: $resolved_images"
                exit 1
              fi

              # bootstrap runs tracked migrations first, then idempotently applies
              # the system defaults required by a brand-new database.
              docker compose run --rm --no-deps expenses-tracker-backend node dist/infrastructure/db-runner.js bootstrap
              # Idempotent: assigns a personal financial account to legacy user-owned rows.
              docker compose run --rm --no-deps expenses-tracker-backend node dist/infrastructure/db-backfill-financial-accounts.js
              docker compose up -d --force-recreate --remove-orphans --pull never expenses-tracker-backend expenses-tracker-inbound-worker

              # Best effort: an LLM outage must never fail an otherwise healthy deploy.
              if ! docker compose run --rm --no-deps expenses-tracker-backend node dist/infrastructure/db-backfill-category-translations.js; then
                echo "Warning: category translation backfill failed; incomplete labels will retry on the next deploy."
              fi

              expected_image_id=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
              echo "Expected image ID: $expected_image_id"
              for service in expenses-tracker-backend expenses-tracker-inbound-worker; do
                running_image_id=$(docker inspect "$service" --format '{{.Image}}')
                running_config_image=$(docker inspect "$service" --format '{{.Config.Image}}')
                running_state=$(docker inspect "$service" --format '{{.State.Running}}')
                created_at=$(docker inspect "$service" --format '{{.Created}}')
                echo "$service image ID:  $running_image_id"
                echo "$service image:     $running_config_image"
                echo "$service running:   $running_state"
                echo "$service created:   $created_at"
                if [ "$running_image_id" != "$expected_image_id" ] || [ "$running_config_image" != "$BACKEND_IMAGE" ] || [ "$running_state" != "true" ]; then
                  echo "$service does not use the expected SHA-tagged image or is not running."
                  docker compose ps
                  docker logs --tail=200 "$service" || true
                  exit 1
                fi
              done

              for attempt in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "Backend failed health check after deploy."
                  docker compose ps
                  docker logs --tail=200 expenses-tracker-backend || true
                  exit 1
                fi

                sleep 2
              done

              # A health response alone can come from an older container image.
              # This protected route must exist and reject the anonymous probe.
              route_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/me/account-context)
              if [ "$route_status" != "401" ]; then
                echo "Expected /me/account-context to return 401 after deploy; received $route_status."
                docker compose ps
                docker logs --tail=200 expenses-tracker-backend || true
                exit 1
              fi

              direct_swagger=$(curl -fsS "http://127.0.0.1:3000/api/docs/swagger-ui-init.js?release=${{ github.sha }}")
              if ! printf '%s' "$direct_swagger" | awk '
                /"\/expenses":/ { expenses = 1; next }
                expenses && /"get":/ { get = 1; next }
                expenses && get && /"post":/ { exit 1 }
                expenses && get && /"name": "subcategoryId"/ { found = 1; exit 0 }
                END { exit found ? 0 : 1 }
              '; then
                echo "Direct backend does not expose the current GET /expenses filter contract."
                exit 1
              fi

              worker_running=$(docker inspect expenses-tracker-inbound-worker --format '{{.State.Running}}')
              if [ "$worker_running" != "true" ]; then
                echo "Inbound worker did not remain running after API verification."
                docker compose ps
                docker logs --tail=200 expenses-tracker-inbound-worker || true
                exit 1
              fi

              docker image prune -a -f --filter "until=168h"
          EOF

      - name: Reload Nginx and verify its API upstream
        run: |
          ssh -i ~/.ssh/oracle_deploy_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            << 'EOF'
              set -e

              sudo systemctl reload nginx

              # Validate the real HTTPS Nginx virtual host. Port 80 correctly
              # redirects to HTTPS, so an HTTP probe would report 301 instead of
              # the expected anonymous 401 from the backend route.
              proxy_status=$(curl -ks -o /dev/null -w "%{http_code}" \
                --resolve "${{ env.PUBLIC_API_HOST }}:443:127.0.0.1" \
                "https://${{ env.PUBLIC_API_HOST }}/me/account-context")
              if [ "$proxy_status" != "401" ]; then
                echo "Expected Nginx to proxy /me/account-context with a 401; received $proxy_status."
                sudo nginx -T
                exit 1
              fi

              # Health and authentication exist in older releases too. Assert the
              # list-expenses contract through the actual Nginx upstream so a stale
              # proxy target cannot make a deployment look healthy.
              proxy_swagger=$(curl -ksS \
                --resolve "${{ env.PUBLIC_API_HOST }}:443:127.0.0.1" \
                "https://${{ env.PUBLIC_API_HOST }}/api/docs/swagger-ui-init.js?release=${{ github.sha }}")
              if ! printf '%s' "$proxy_swagger" | awk '
                /"\/expenses":/ { expenses = 1; next }
                expenses && /"get":/ { get = 1; next }
                expenses && get && /"post":/ { exit 1 }
                expenses && get && /"name": "subcategoryId"/ { found = 1; exit 0 }
                END { exit found ? 0 : 1 }
              '; then
                echo "Nginx did not expose the current GET /expenses filter contract."
                nginx -T 2>&1 || true
                echo "Readable Nginx upstream declarations:"
                grep -R --line-number -E 'server_name|proxy_pass' /etc/nginx 2>/dev/null || true
                echo "Listening TCP services:"
                ss -ltnp 2>/dev/null || ss -ltn || true
                echo "Running containers and published ports:"
                docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}'
                exit 1
              fi
          EOF

      - name: Verify public expense filter contract
        run: |
          public_swagger=$(curl --retry 5 --retry-delay 2 --fail --silent --show-error \
            "https://${{ env.PUBLIC_API_HOST }}/api/docs/swagger-ui-init.js?release=${{ github.sha }}")
          if ! printf '%s' "$public_swagger" | awk '
            /"\/expenses":/ { expenses = 1; next }
            expenses && /"get":/ { get = 1; next }
            expenses && get && /"post":/ { exit 1 }
            expenses && get && /"name": "subcategoryId"/ { found = 1; exit 0 }
            END { exit found ? 0 : 1 }
          '; then
            echo "Public API did not expose the deployed GET /expenses filter contract."
            exit 1
          fi
