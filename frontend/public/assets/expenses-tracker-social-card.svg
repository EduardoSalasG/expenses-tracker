<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Expenses Tracker</title>
  <desc id="desc">Una vista de gastos, ingresos y presupuesto mensual.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#12264b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="88" r="260" fill="#2563eb" opacity=".18"/>
  <rect x="86" y="76" width="1028" height="478" rx="34" fill="#0f1d35" stroke="#31517e"/>
  <rect x="126" y="116" width="54" height="54" rx="16" fill="url(#accent)"/>
  <text x="153" y="151" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">ET</text>
  <text x="202" y="143" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Expenses Tracker</text>
  <text x="128" y="235" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Entiende en qué se va tu dinero.</text>
  <text x="128" y="284" fill="#b8c7df" font-family="Arial, sans-serif" font-size="25">Gastos, ingresos y presupuesto en un solo lugar.</text>
  <rect x="128" y="344" width="278" height="146" rx="22" fill="#172b4d" stroke="#31517e"/>
  <text x="156" y="386" fill="#9db3d5" font-family="Arial, sans-serif" font-size="18">Gastos del mes</text>
  <text x="156" y="446" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">$514.890</text>
  <rect x="432" y="344" width="278" height="146" rx="22" fill="#172b4d" stroke="#31517e"/>
  <text x="460" y="386" fill="#9db3d5" font-family="Arial, sans-serif" font-size="18">Ingresos del mes</text>
  <text x="460" y="446" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">$1.249.562</text>
  <rect x="736" y="344" width="278" height="146" rx="22" fill="#172b4d" stroke="#31517e"/>
  <text x="764" y="386" fill="#9db3d5" font-family="Arial, sans-serif" font-size="18">Presupuesto usado</text>
  <text x="764" y="446" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="42" font-weight="700">64%</text>
</svg>
